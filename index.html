<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111827;color:#f3f4f6;padding:20px;max-width:800px;margin:0 auto}
.box{background:#1f2937;border-radius:14px;padding:20px;margin-bottom:16px}
h2{margin-bottom:12px;color:#93c5fd}
a{display:block;padding:10px 12px;margin:8px 0;background:#2563eb;border-radius:8px;color:#fff;text-decoration:none}
a:hover{background:#1d4ed8}
button{padding:10px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px}
input{padding:10px;border-radius:8px;border:1px solid #444;background:#27272a;color:#fff;width:220px}
.announce{background:#374151;padding:14px;border-radius:10px;margin-bottom:18px}
.tip{color:#aaa;font-size:14px;margin-top:6px}
</style>
</head>
<body>
<div class="announce">
<h3>公告</h3>
<p>本导航用于微机课使用/p>
</div>

<div class="box">
<h2>常用站点</h2>
<a href="https://goutoudadui.github.io" target="_blank">狗头大队谱面确认</a>
<a href="https://theworldatplay.com/zh-CN/fish-eat-fish" target="_blank">鱼吃鱼</a>
<a href="https://hi8.com/binghuo" target="_blank">森林冰火人</a>
</div>

<div class="box">
<h2>测试分区（需要密码）</h2>
<input id="pwdInput" placeholder="输入密码">
<button onclick="checkPwd()">进入</button>
<div class="tip">密码：521314</div>
</div>

<div class="box" id="about">
<h2>关于我（彩蛋：连续点击5次）</h2>
<p>点击这里触发彩蛋</p>
</div>

<script>
// 测试分区密码校验
function checkPwd(){
    const p = document.getElementById('pwdInput').value.trim();
    if(p === '521314'){
        window.open('https://maimai.lxns.net/','_blank');
    }else{
        alert('密码错误！');
    }
}

// 塔菲彩蛋，仅保留带密码蓝奏云链接
let clickCount = 0;
const aboutDom = document.getElementById('about');
aboutDom.onclick = function(){
    clickCount++;
    if(clickCount >= 5){
        clickCount = 0;
        alert('密码：mjmj');
        window.open('https://wwbbe.lanzoub.com/igZb54gr791a','_blank');
    }
}
</script>
</body>
</html>
